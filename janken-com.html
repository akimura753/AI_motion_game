<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>みんなのじゃんけん・あっちむいてほい（janken-com v2）</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#000;--card:#1f2937;--acc:#2563eb;--ok:#16a34a;--ng:#dc2626;--warn:#f59e0b;--fg:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;padding:8px;transition:background .15s}
  body.flash{background:#fff;color:#000}
  .wrap{max-width:720px;margin:0 auto;display:grid;gap:10px}
  h1{font-size:1.2rem;text-align:center}
  .screen{display:none}.screen.on{display:grid;gap:10px}
  button{width:100%;min-height:64px;padding:14px;border:3px solid #fff;border-radius:16px;font-size:1.4rem;font-weight:700;color:#fff;background:var(--acc);cursor:pointer}
  button:disabled{opacity:.35}
  button.sel{background:var(--ok)}
  button.ng{background:var(--ng)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .card{background:var(--card);border-radius:16px;padding:12px;text-align:center}
  .code{font-size:4rem;font-weight:900;letter-spacing:.3em;text-align:center}
  #status{font-size:2rem;font-weight:900;text-align:center;min-height:2.6em;line-height:1.3;padding:8px;border-radius:16px;background:#111}
  #status.win{background:var(--ok)}#status.lose{background:var(--ng)}#status.draw{background:var(--warn);color:#000}
  .hint{font-size:.9rem;opacity:.7;text-align:center}
  .stage{position:relative;aspect-ratio:3/4;max-height:38dvh;background:#000;border-radius:16px;overflow:hidden;margin:0 auto;width:100%}
  video,canvas.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hand{font-size:6rem;line-height:1.1}
  .lbl{font-size:1.2rem;font-weight:700}
  .name{font-size:1.4rem;font-weight:900}
  #score{font-size:2.4rem;font-weight:900}
  .sub{font-size:1rem;opacity:.85}
  .seen{display:inline-block;width:1em;height:1em;border-radius:50%;background:#555;vertical-align:middle;margin-left:6px}
  .seen.on{background:var(--ok)}
  input{font-size:2rem;width:100%;padding:10px;border-radius:12px;border:3px solid #fff;background:#111;color:#fff;text-align:center;letter-spacing:.3em}
  .small{min-height:48px;font-size:1.1rem}
  #hud{position:absolute;left:6px;top:6px;font-size:.7rem;font-family:monospace;background:rgba(0,0,0,.6);padding:3px
