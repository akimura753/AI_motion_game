<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>みんなのじゃんけん・あっちむいてほい（janken-com v2）</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#000;--card:#1f2937;--acc:#2563eb;--ok:#16a34a;--ng:#dc2626;--warn:#f59e0b;--fg:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;padding:8px;transition:background .15s}
  body.flash{background:#fff;color:#000}
  .wrap{max-width:720px;margin:0 auto;display:grid;gap:10px}
  h1{font-size:1.2rem;text-align:center}
  .screen{display:none}.screen.on{display:grid;gap:10px}
  button{width:100%;min-height:64px;padding:14px;border:3px solid #fff;border-radius:16px;font-size:1.4rem;font-weight:700;color:#fff;background:var(--acc);cursor:pointer}
  button:disabled{opacity:.35}
  button.sel{background:var(--ok)}
  button.ng{background:var(--ng)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .card{background:var(--card);border-radius:16px;padding:12px;text-align:center}
  .code{font-size:4rem;font-weight:900;letter-spacing:.3em;text-align:center}
  #status{font-size:2rem;font-weight:900;text-align:center;min-height:2.6em;line-height:1.3;padding:8px;border-radius:16px;background:#111}
  #status.win{background:var(--ok)}#status.lose{background:var(--ng)}#status.draw{background:var(--warn);color:#000}
  .hint{font-size:.9rem;opacity:.7;text-align:center}
  .stage{position:relative;aspect-ratio:3/4;max-height:38dvh;background:#000;border-radius:16px;overflow:hidden;margin:0 auto;width:100%}
  video,canvas.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hand{font-size:6rem;line-height:1.1}
  .lbl{font-size:1.2rem;font-weight:700}
  .name{font-size:1.4rem;font-weight:900}
  #score{font-size:2.4rem;font-weight:900}
  .sub{font-size:1rem;opacity:.85}
  .seen{display:inline-block;width:1em;height:1em;border-radius:50%;background:#555;vertical-align:middle;margin-left:6px}
  .seen.on{background:var(--ok)}
  input{font-size:2rem;width:100%;padding:10px;border-radius:12px;border:3px solid #fff;background:#111;color:#fff;text-align:center;letter-spacing:.3em}
  .small{min-height:48px;font-size:1.1rem}
  #hud{position:absolute;left:6px;top:6px;font-size:.7rem;font-family:monospace;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤝 みんなのじゃんけん・あっちむいてほい</h1>
  <div id="status" role="status" aria-live="assertive">はじめに、あなたのことを教えてね</div>
  <div class="hint">画面のボタン以外をタップすると、いまの内容をもう一度読み上げます</div>

  <!-- 画面1：アクセシビリティ設定 -->
  <section id="s-acc" class="screen on">
    <div class="card"><div class="lbl">あなたは？（あてはまるものを押してね）</div></div>
    <div class="grid2">
      <button id="accBlind" aria-pressed="false">👁️ 目が見えにくい<br><span class="sub">音と振動でお知らせ</span></button>
      <button id="accDeaf" aria-pressed="false">👂 耳が聞こえにくい<br><span class="sub">大きな絵と光と振動でお知らせ</span></button>
    </div>
    <button id="accNext" class="sel">つぎへ ▶</button>
  </section>

  <!-- 画面2：相手の選択 -->
  <section id="s-conn" class="screen">
    <div class="grid2">
      <button id="btnHost">📱 部屋をつくる<br><span class="sub">番号を相手に教える</span></button>
      <button id="btnJoin">🔢 部屋に入る<br><span class="sub">相手の番号を入れる</span></button>
    </div>
    <button id="btnSolo" class="small">🤖 ひとりで練習（AIと）</button>
    <div id="hostBox" class="card" style="display:none">
      <div class="lbl">この番号を相手に教えてね</div><div class="code" id="roomCode">----</div>
      <button id="btnSayCode" class="small">🔊 番号をもう一度読む</button>
      <div class="sub" id="hostWait">相手を待っています…</div>
    </div>
    <div id="joinBox" class="card" style="display:none">
      <div class="lbl">相手の番号（4けた）</div>
      <input id="codeIn" inputmode="numeric" maxlength="4" aria-label="相手の番号4けた" placeholder="1234">
      <div class="grid3" id="pad"></div>
      <button id="btnConnect" class="sel">つなぐ ▶</button>
    </div>
  </section>

  <!-- 画面3：ゲーム -->
  <section id="s-game" class="screen">
    <div class="stage">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay" class="cam"></canvas>
      <div id="hud"></div>
    </div>
    <div class="card"><span class="lbl">カメラ：手<span id="seenHand" class="seen"></span> 顔<span id="seenFace" class="seen"></span></span>
      <div class="sub" id="camHint">うでをのばして、スマホを顔の前にもってね</div></div>
    <div class="hands">
      <div class="card"><div class="name">あなた</div><div class="hand" id="myHand">🤔</div><div class="lbl" id="myLbl">-</div></div>
      <div class="card"><div class="name" id="oppName">あいて</div><div class="hand" id="oppHand">❔</div><div class="lbl" id="oppLbl">-</div></div>
    </div>
    <div class="card"><div class="sub">スコア（あなた : あいて）</div><div id="score">0 : 0</div><div class="sub" id="roundInfo">&nbsp;</div></div>
    <div id="hostCtl" style="display:none">
      <div class="lbl" style="text-align:center">なんかい勝負？</div>
      <div class="grid3"><button class="rounds" data-n="1">1回</button><button class="rounds" data-n="2">2回</button><button class="rounds" data-n="3">3回</button></div>
    </div>
    <button id="btnCam" class="sel">📷 カメラをつける</button>
    <button id="btnRepeat" class="small">🔊 いまの内容をもう一度</button>
    <button id="btnAgain" class="small" style="display:none">🔁 もういちど</button>
  </section>
</div>

<script type="module">
import {HandLandmarker, FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ================= アクセシビリティ ================= */
const A={blind:false,deaf:false};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function flash(ms=250){document.body.classList.add("flash");setTimeout(()=>document.body.classList.remove("flash"),ms);}
let audioCtx=null;
function beep(freq=880,ms=80,vol=.25){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+ms/1000);}catch(e){}}
/* keep=true のときは前の発話を打ち切らず、続けて読む（結果の読み上げ用） */
function say(t,{rate=1.0,keep=false}={}){
  if(!window.speechSynthesis)return;if(!keep)speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=A.blind?rate*1.15:rate;speechSynthesis.speak(u);}
let lastStatus="";
function status(t,cls="",{speak=true}={}){$("status").textContent=t;$("status").className=cls;lastStatus=t;
  if(speak)say(t,{keep:cls!==""});}   // 勝敗・あいこ（クラス付き）は前の発話に続けて必ず最後まで読む
function repeatStatus(){if(lastStatus)say(lastStatus);vib([60]);}
document.addEventListener("click",e=>{if(e.target.closest("button,input"))return;repeatStatus();});
/* 合図：目が見えにくい→ビープ＋振動、耳が聞こえにくい→点滅＋振動、両方は常に */
function cue(kind){
  const P={tick:[80],pon:[250],win:[150,80,150,80,300],lose:[600],draw:[100,100,100],hoi:[250]};
  vib(P[kind]||[100]);
  if(kind==="tick")beep(660,60);if(kind==="pon"||kind==="hoi")beep(1046,200,.4);
  if(kind==="win")beep(1320,300,.4);if(kind==="lose")beep(330,400,.4);if(kind==="draw")beep(784,150);
  if(A.deaf||!A.blind)flash(kind==="pon"||kind==="hoi"?350:150);}
/* 結果を確実に伝える：読み上げ → 間 → もう一度読み上げ */
async function announceResult(t,cls,kind){status(t,cls);cue(kind);await sleep(2600);say(lastStatus,{keep:true});await sleep(2400);}

/* ================= 手の分類（finger版 v2） ================= */
const F={thumb:[1,2,3,4],index:[5,6,7,8],middle:[9,10,11,12],ring:[13,14,15,16],pinky:[17,18,19,20]};
const FOUR=["index","middle","ring","pinky"];
const CFG={ext:40,curled:55,pointLen:0.6,faceX:0.15,faceY:0.07};
const sub=(a,b)=>[a.x-b.x,a.y-b.y,a.z-b.z],norm=v=>Math.hypot(...v);
function angle(a,b,c){const v1=sub(a,b),v2=sub(c,b),n=norm(v1)*norm(v2);if(n<1e-9)return 180;
  return Math.acos(Math.max(-1,Math.min(1,(v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2])/n)))*180/Math.PI;}
const palm=lm=>norm(sub(lm[9],lm[0]))+1e-9;
function curl(lm,f){const[m,p,d,t]=F[f];return((180-angle(lm[m],lm[p],lm[d]))+(180-angle(lm[p],lm[d],lm[t])))/2;}
const curls=lm=>Object.fromEntries(FOUR.map(f=>[f,curl(lm,f)]));
const tipRatio=(lm,f)=>norm(sub(lm[F[f][3]],lm[0]))/palm(lm);
const tipMcp=(lm,f)=>norm(sub(lm[F[f][3]],lm[F[f][0]]))/palm(lm);
function extended(lm,f,c){return c[f]<CFG.ext||tipRatio(lm,f)>1.5;}
function thumbOut(lm){return norm(sub(lm[4],lm[9]))/palm(lm)>0.9;}
function dirOf(sx,sy){const a=Math.atan2(-sy,sx)*180/Math.PI;
  if(a>=-45&&a<45)return"right";if(a>=45&&a<135)return"up";if(a>=-135&&a<-45)return"down";return"left";}
function pointDir(lm){const v=[lm[8].x-lm[5].x,lm[8].y-lm[5].y];
  if(Math.hypot(...v)/palm(lm)<CFG.pointLen)return null;return dirOf(-v[0],v[1]);}
function classify(lm){const c=curls(lm);const e=Object.fromEntries(FOUR.map(f=>[f,extended(lm,f,c)]));
  const n=FOUR.filter(f=>e[f]).length;
  if(n===0||FOUR.every(f=>tipMcp(lm,f)<0.7)||(FOUR.every(f=>c[f]>=CFG.curled)&&FOUR.every(f=>tipRatio(lm,f)<1.4)))return"rock";
  const im=(c.index+c.middle)/2,rp=(c.ring+c.pinky)/2;
  const imTip=(tipRatio(lm,"index")+tipRatio(lm,"middle"))/2,rpTip=(tipRatio(lm,"ring")+tipRatio(lm,"pinky"))/2;
  if(e.index&&e.middle&&(rp-im>25||imTip-rpTip>0.45))return"scissors";
  if(n===4||(e.index&&e.middle&&e.ring&&thumbOut(lm)))return"paper";
  if(e.index&&!e.middle&&!e.ring&&!e.pinky)return pointDir(lm)||"unknown";
  return"unknown";}

/* ================= 顔の向き ================= */
function faceMetrics(f){const w=Math.abs(f[454].x-f[234].x)+1e-9,h=Math.abs(f[152].y-f[10].y)+1e-9;
  return{dx:-(f[1].x-(f[234].x+f[454].x)/2)/w,dy:(f[1].y-(f[10].y+f[152].y)/2)/h};}
function faceDir(m,base){const dx=m.dx-base.dx,dy=m.dy-base.dy;
  if(Math.abs(dx)/CFG.faceX>Math.abs(dy)/CFG.faceY){if(Math.abs(dx)>CFG.faceX)return dx>0?"right":"left";}
  else if(Math.abs(dy)>CFG.faceY)return dy>0?"down":"up";return null;}
class Smoother{constructor(n=9,r=.6){this.n=n;this.r=r;this.b=[];}
  update(l){this.b.push(l);if(this.b.length>this.n)this.b.shift();const v={};
    for(const x of this.b)if(x&&x!=="unknown")v[x]=(v[x]||0)+1;
    const best=Object.entries(v).sort((a,b)=>b[1]-a[1])[0];if(!best)return null;
    return best[1]/this.b.length>=this.r?best[0]:null;}}

/* ================= 定数 ================= */
const JANKEN=["rock","paper","scissors"],DIRS=["up","down","left","right"];
const BEATS={rock:"scissors",paper:"rock",scissors:"paper"};
const EMOJI={rock:"✊",paper:"✋",scissors:"✌️",up:"👆",down:"👇",left:"👈",right:"👉"};
const JP={rock:"グー",paper:"パー",scissors:"チョキ",up:"うえ",down:"した",left:"ひだり",right:"みぎ"};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= 画面1：アクセシビリティ ================= */
function toggle(btn,key){A[key]=!A[key];btn.setAttribute("aria-pressed",A[key]);btn.classList.toggle("sel",A[key]);
  say(A[key]?btn.textContent.split("\n")[0]+"、オン":"オフ");vib([60]);}
$("accBlind").onclick=()=>toggle($("accBlind"),"blind");
$("accDeaf").onclick=()=>toggle($("accDeaf"),"deaf");
$("accNext").onclick=()=>{show("s-conn");status("だれと遊ぶ？ 部屋をつくる、部屋に入る、ひとりで練習、から選んでね");};
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");}
lastStatus="はじめに、あなたのことを教えてね。目が見えにくい、耳が聞こえにくい、あてはまるボタンを押してから、つぎへ、を押してね";
say(lastStatus);

/* ================= 通信（PeerJS） ================= */
let peer=null,conn=null,isHost=false,solo=false;
const PREFIX="janken-com-";
function send(o){if(conn&&conn.open)conn.send(o);}
const inbox={hand:null,dir:null};
function onMessage(m){
  if(m.type==="hello"){say("つながりました",{keep:true});cue("win");
    if(isHost){$("hostCtl").style.display="block";status("つながった！ なんかい勝負にする？ 1回、2回、3回のボタンを押してね");}
    else status("つながった！ あいてが回数を決めています。まってね");}
  if(m.type==="go"){runSession(m.n,m.at);}
  if(m.type==="hand"){inbox.hand=m.hand;}
  if(m.type==="dir"){inbox.dir=m.dir;}
  if(m.type==="again"){resetForNext();}}
async function waitFor(key,ms){const end=Date.now()+ms;while(Date.now()<end){if(inbox[key]){const v=inbox[key];inbox[key]=null;return v;}await sleep(50);}return null;}

$("btnHost").onclick=()=>{isHost=true;const code=String(Math.floor(1000+Math.random()*9000));
  $("hostBox").style.display="block";$("joinBox").style.display="none";$("roomCode").textContent=code;
  peer=new Peer(PREFIX+code);
  peer.on("open",()=>{status("あなたの部屋番号は "+code.split("").join(" ")+" です。あいてに教えてね");});
  peer.on("connection",c=>{conn=c;conn.on("data",onMessage);conn.on("open",()=>{send({type:"hello"});onMessage({type:"hello"});show("s-game");$("oppName").textContent="あいて";});});
  peer.on("error",e=>status("つなげません："+e.type,"lose"));};
$("btnSayCode").onclick=()=>say("部屋番号は "+$("roomCode").textContent.split("").join(" ")+" です");
$("btnJoin").onclick=()=>{isHost=false;$("joinBox").style.display="block";$("hostBox").style.display="none";
  status("あいての番号を4つ入れて、つなぐ、を押してね");};
for(const k of["1","2","3","4","5","6","7","8","9","⌫","0","OK"]){const b=document.createElement("button");b.textContent=k;b.className="small";
  b.onclick=()=>{const i=$("codeIn");if(k==="⌫")i.value=i.value.slice(0,-1);else if(k==="OK")$("btnConnect").click();else if(i.value.length<4)i.value+=k;
    say(k==="⌫"?"けす":k==="OK"?"":k);vib([40]);};$("pad").appendChild(b);}
$("btnConnect").onclick=()=>{const code=$("codeIn").value.trim();if(code.length!==4){status("番号は4つです");return;}
  status("つないでいます…");peer=new Peer();
  peer.on("open",()=>{conn=peer.connect(PREFIX+code,{reliable:true});conn.on("data",onMessage);
    conn.on("open",()=>{send({type:"hello"});show("s-game");});
    setTimeout(()=>{if(!conn.open)status("つながりません。番号をたしかめてね","lose");},8000);});
  peer.on("error",e=>status("つなげません："+e.type,"lose"));};
$("btnSolo").onclick=()=>{solo=true;isHost=true;show("s-game");$("oppName").textContent="AI";$("hostCtl").style.display="block";
  status("AIと練習します。カメラをつけてから、なんかい勝負か選んでね");};

/* ================= カメラ・認識 ================= */
const video=$("video"),cv=$("overlay"),ctx=cv.getContext("2d");
let hand=null,face=null,lastT=-1,frame=0,stable=null,lastLm=null,faceNow=null,faceBase={dx:0,dy:0},baseBuf=[],useFace=false;
const sm=new Smoother();let lastBeepHand=0,lastBeepFace=0;
$("btnCam").onclick=async()=>{
  $("btnCam").disabled=true;status("カメラを準備しています。すこし待ってね");
  try{
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"},
      runningMode:"VIDEO",numHands:1,minHandDetectionConfidence:.6,minTrackingConfidence:.6});
    face=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
      runningMode:"VIDEO",numFaces:1});
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});
    await video.play();cv.width=video.videoWidth;cv.height=video.videoHeight;
    $("btnCam").style.display="none";
    status("カメラOK。うでをのばして、スマホを顔の前にもってね。手が見えると、ピッと鳴るよ");
    loop();
  }catch(e){status("カメラがつかえません："+e.message,"lose");$("btnCam").disabled=false;}};
function loop(){
  if(hand&&video.readyState>=2&&video.currentTime!==lastT){lastT=video.currentTime;frame++;
    const t=performance.now();ctx.clearRect(0,0,cv.width,cv.height);let raw=null;
    const hr=hand.detectForVideo(video,t);
    if(hr.landmarks.length){const lm=hr.landmarks[0];lastLm=lm;raw=classify(lm);
      lm.forEach(p=>{ctx.fillStyle="#0f0";ctx.beginPath();ctx.arc(p.x*cv.width,p.y*cv.height,5,0,7);ctx.fill();});
      $("seenHand").classList.add("on");if(A.blind&&t-lastBeepHand>1500){beep(880,50,.15);lastBeepHand=t;}
    }else{lastLm=null;$("seenHand").classList.remove("on");}
    stable=sm.update(raw);$("myHand").textContent=EMOJI[stable]||"🤔";$("myLbl").textContent=stable?JP[stable]:"-";
    if(useFace||frame%3===0){const fr=face.detectForVideo(video,t+0.5);
      if(fr.faceLandmarks.length){const f=fr.faceLandmarks[0];faceNow=faceMetrics(f);$("seenFace").classList.add("on");
        if(A.blind&&t-lastBeepFace>2500){beep(440,50,.12);lastBeepFace=t;}
        if(!useFace){baseBuf.push(faceNow);if(baseBuf.length>15)baseBuf.shift();
          faceBase={dx:baseBuf.reduce((a,b)=>a+b.dx,0)/baseBuf.length,dy:baseBuf.reduce((a,b)=>a+b.dy,0)/baseBuf.length};}
      }else{faceNow=null;$("seenFace").classList.remove("on");}}
    $("hud").textContent=raw||"";}
  requestAnimationFrame(loop);}
async function sample(ms,getter){const v={};const end=performance.now()+ms;
  while(performance.now()<end){const x=getter();if(x)v[x]=(v[x]||0)+1;await sleep(40);}
  const b=Object.entries(v).sort((a,b)=>b[1]-a[1])[0];return b?b[0]:null;}

/* ================= ゲーム進行（両端末で同じ時刻表で進む） ================= */
let ps=0,os=0;
document.querySelectorAll(".rounds").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;$("hostCtl").style.display="none";
  const at=Date.now()+2000;send({type:"go",n,at});runSession(n,at);});
async function runSession(n,at){
  ps=os=0;$("score").textContent="0 : 0";
  status(`${n}回勝負！ 手をカメラにむけてね`);await sleep(Math.max(0,at-Date.now()));
  for(let r=1;r<=n;r++){
    $("roundInfo").textContent=`${r}回目 / ${n}回`;
    let winner=null,mine,theirs;
    for(let k=0;k<6&&!winner;k++){
      $("oppHand").textContent="❔";$("oppLbl").textContent="-";
      status("さいしょはグー");cue("tick");await sleep(1100);
      status("じゃんけん…");cue("tick");await sleep(1000);
      status("ぽん！");cue("pon");await sleep(500);
      mine=stable;
      if(!JANKEN.includes(mine)){await announceResult("手が見えなかったよ。もういちど","draw","draw");continue;}
      $("myHand").textContent=EMOJI[mine];
      if(solo){theirs=pick(JANKEN);}else{send({type:"hand",hand:mine});theirs=await waitFor("hand",6000);}
      if(!theirs){await announceResult("あいての手がとどかなかったよ","draw","draw");continue;}
      $("oppHand").textContent=EMOJI[theirs];$("oppLbl").textContent=JP[theirs];
      if(mine===theirs){await announceResult(`あなた${JP[mine]}、あいて${JP[theirs]}。あいこ！`,"draw","draw");continue;}
      winner=BEATS[mine]===theirs?"me":"opp";
      await announceResult(`あなた${JP[mine]}、あいて${JP[theirs]}。${winner==="me"?"あなたの勝ち！ つぎは、あなたがゆびで指すよ":"あいての勝ち。つぎは、あなたが顔をむけるよ"}`,
        winner==="me"?"win":"lose",winner==="me"?"win":"lose");}
    if(!winner){status("あいこがつづいたので次へ");await sleep(2000);continue;}
    // あっち向いてほい
    $("oppHand").textContent="❔";$("oppLbl").textContent="-";
    status(winner==="me"?"あっちむいて…（ゆびで、うえ・した・みぎ・ひだりを指してね）":"あっちむいて…（顔を、うえ・した・みぎ・ひだり、どこかにむけてね）");
    cue("tick");await sleep(2400);
    status("ほい！");cue("hoi");
    let myDir;
    if(winner==="me"){await sleep(300);myDir=await sample(1000,()=>DIRS.includes(stable)?stable:null);}
    else{useFace=true;await sleep(300);myDir=await sample(1000,()=>faceNow?faceDir(faceNow,faceBase):null);useFace=false;}
    if(!myDir)myDir="none";
    $("myHand").textContent=EMOJI[myDir]||"🙂";$("myLbl").textContent=JP[myDir]||"まっすぐ";
    let theirDir;
    if(solo){theirDir=pick(DIRS);}else{send({type:"dir",dir:myDir});theirDir=await waitFor("dir",6000)||"none";}
    $("oppHand").textContent=EMOJI[theirDir]||"🙂";$("oppLbl").textContent=JP[theirDir]||"まっすぐ";
    const hit=myDir!=="none"&&myDir===theirDir, my=JP[myDir]||"まっすぐ", th=JP[theirDir]||"まっすぐ";
    if(winner==="me"){
      if(hit){ps++;await announceResult(`あなた${my}、あいて${th}。あたり！ あなたの点！`,"win","win");}
      else await announceResult(`あなた${my}、あいて${th}。はずれ！`,"draw","draw");}
    else{
      if(hit){os++;await announceResult(`あいて${th}、あなた${my}。あたられた！ あいての点`,"lose","lose");}
      else await announceResult(`あいて${th}、あなた${my}。にげきった！`,"win","win");}
    $("score").textContent=`${ps} : ${os}`;say(`いま、あなた${ps}点、あいて${os}点`,{keep:true});await sleep(2500);}
  const fin=ps>os?"あなたの勝ち！":os>ps?"あいての勝ち":"ひきわけ";
  await announceResult(`おわり！ ${ps}たい${os}で ${fin}`,ps>os?"win":os>ps?"lose":"draw",ps>os?"win":os>ps?"lose":"draw");
  if(isHost){$("btnAgain").style.display="block";say("もういちど、のボタンで続けられます",{keep:true});}}
function resetForNext(){$("btnAgain").style.display="none";$("myHand").textContent="🤔";$("oppHand").textContent="❔";
  if(isHost){$("hostCtl").style.display="block";status("もういちど。なんかい勝負？");}else status("あいてが回数を決めています");}
$("btnAgain").onclick=()=>{send({type:"again"});resetForNext();};
$("btnRepeat").onclick=repeatStatus;
</script>
</body>
</html>
